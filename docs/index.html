<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#15171b;--pan:#1d2025;--pan2:#252930;--ink:#ece8df;--mut:#9aa0a6;--line:#2e3239;--gold:#cdb27a;--teal:#6fb3a8;--lav:#a799d6;--pink:#d39aa8;--blue:#86a8d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
header{padding:20px 20px 0;max-width:1000px;margin:auto}
h1{font-size:26px;margin:0;letter-spacing:.2px}h1 span{color:var(--gold)}
.q{color:var(--mut);margin:2px 0 14px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}
main{max-width:1000px;margin:auto;padding:18px 20px 60px}
section{display:none}section.on{display:block}
h2{font-size:19px;margin:26px 0 10px;font-weight:700}h2:first-child{margin-top:0}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.k small{color:var(--mut);display:block;font-size:14px}.k b{font-size:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.nm{font-weight:700}.sm{font-size:14.5px;color:var(--mut)}.r{text-align:right}
.bar{height:7px;background:var(--pan2);border-radius:9px;margin-top:8px;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px}
.up{color:var(--teal)}.dn{color:var(--pink)}
.tag{font-size:14px;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.empty{padding:18px 0;color:var(--mut)}
.alert{padding:16px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.alert b{font-size:19px}.gold{color:var(--gold)}.pinkc{color:var(--pink)}
.fail{border:1px solid var(--pink);border-radius:12px;padding:16px 18px;color:var(--pink);background:#2a1f23}
.scan{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:8px;animation:s 2.4s ease-in-out infinite}
@keyframes s{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.scan{animation:none}}
.seg{display:flex;height:12px;border-radius:9px;overflow:hidden;gap:2px;margin:8px 0 4px}.seg i{display:block}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:400}.tw{overflow-x:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<header><h1>Investment <span>Bot</span></h1><p class="q">Paper trading only. Where should my capital be now?</p>
<nav role="tablist" id="nav"></nav></header>
<main>
<section id="master"><div id="strip" class="strip"></div><h2>Capital by portfolio</h2><div id="alloc" class="panel"></div>
<h2>Needs your decision</h2><div id="decM" class="panel"></div><h2>System</h2><div id="healthM" class="panel"></div></section>
<section id="portfolios"><div id="pf"></div></section>
<section id="decisions"><h2>Active decisions</h2><div id="dec" class="panel"></div><h2>Archived</h2><div id="arch" class="panel"></div></section>
<section id="market"><div id="mk"></div></section>
<section id="positions"><h2>Open positions</h2><div id="pos" class="panel"></div></section>
<section id="ledger"><h2>Decision ledger</h2><div class="panel tw" id="led"></div><p class="sm">LIVE = you bought it. MISSED = alert expired without a buy; it is not counted as a trade.</p></section>
<section id="health"><h2>System health</h2><div id="hl"></div></section>
</main>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL={india_long_term:"var(--gold)",india_intraday:"var(--blue)",options:"var(--lav)",commodities:"var(--pink)",us_global:"var(--blue)",crypto:"var(--teal)"};
const R=n=>(n<0?"-":"")+"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN"),S=n=>(n>=0?"+":"")+R(n).replace("-","−");
const ago=t=>{if(!t)return"never";const m=Math.round((Date.now()-new Date(t))/60000);return m<1?"just now":m<90?m+" min ago":m<2880?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago"};
const nice=x=>x.replace(/\.NS$/,""),cl=n=>n>=0?"up":"dn";
const TABS=[["master","Master"],["portfolios","Portfolios"],["decisions","Decisions"],["market","Market"],["positions","Positions"],["ledger","Ledger"],["health","System health"]];
$("nav").innerHTML=TABS.map(([i,t])=>`<button role="tab" data-t="${i}">${t}</button>`).join("");
function show(i){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===i));document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===i));history.replaceState(0,"","#"+i)}
$("nav").onclick=e=>e.target.dataset.t&&show(e.target.dataset.t);show(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):"master");
const bk=s=>Object.fromEntries(s.portfolio.map(b=>[b.id,b]));
async function load(){let s;try{s=await (await fetch("state.json?"+Date.now())).json()}catch(e){return}
 const stale=(Date.now()-new Date(s.heartbeat))/60000>s.interval_min*3,hs=Object.values(s.health).sort((a,b)=>a.stage-b.stage),
 bad=hs.some(h=>h.status==="error"||h.status==="degraded"),B=bk(s),held=new Set(s.positions.map(p=>p.symbol)),
 state=stale?["×","SYSTEM FAILURE — DO NOT RELY ON PREVIOUS SIGNAL","pinkc"]:bad?["◇","DEGRADED","gold"]:["◆","ACTIVE","up"];
 const tot=s.portfolio.reduce((a,b)=>a+b.capital,0),cash=s.portfolio.reduce((a,b)=>a+b.cash,0),dep=s.portfolio.reduce((a,b)=>a+b.deployed,0),
 pnl=s.portfolio.reduce((a,b)=>a+b.realised+b.unrealised,0);
 $("strip").innerHTML=[["Total paper capital",R(tot)],["Available",R(cash)],["Deployed",R(dep)],["Portfolio value",R(tot+pnl)],["Profit / loss",`<span class="${cl(pnl)}">${S(pnl)}</span>`]].map(([a,b])=>`<div class="k"><small>${a}</small><b>${b}</b></div>`).join("");
 $("alloc").innerHTML=`<div class="seg">${s.portfolio.map(b=>`<i style="flex:${Math.max(b.deployed,0)+.0001};background:${COL[b.id]}"></i>`).join("")}<i style="flex:${Math.max(cash,.0001)};background:var(--pan2)"></i></div><div class="sm">Colour = money in trades. Dark = cash waiting.</div>`+
  s.portfolio.map(b=>`<div class="row"><div><div class="nm" style="color:${COL[b.id]}">${E(b.label)}</div><div class="sm">${b.active?`${b.positions} open · cash ${R(b.cash)}`:"Not connected yet"}</div></div><div class="r"><div class="nm">${R(b.capital+b.realised+b.unrealised)}</div><div class="sm ${cl(b.realised+b.unrealised)}">${S(b.realised+b.unrealised)}</div></div></div>`).join("");
 // decisions
 const enters=s.signals.filter(x=>!held.has(x.symbol)&&Date.now()-new Date(x.ts)<3*864e5).reverse(),
 exits=s.exits.filter(x=>held.has(x.symbol)&&Date.now()-new Date(x.ts)<864e5).reverse(),
 archived=s.signals.filter(x=>!enters.includes(x)).reverse();
 const card=(sym,a,cls,id,body)=>`<div class="alert"><b class="${cls}">${sym} ${E(nice(a))}</b> <span class="sm">${E(id)}</span><div class="sm">${body}</div></div>`;
 const decs=stale?`<div class="fail">× SYSTEM FAILURE — DO NOT RELY ON PREVIOUS SIGNAL<br><span class="sm">Last check ${ago(s.heartbeat)}. Old alerts are hidden until the bot recovers.</span></div>`:
  (exits.map(x=>card("×",x.symbol,"pinkc",x.decision_id,`Exit condition: ${E(x.reason)}. Tell the bot: sold ${E(x.symbol)} &lt;price&gt;`)).join("")+
  enters.map(x=>card("◆",x.symbol,"gold",x.decision_id,`ENTER around ${x.entry} · stop ${x.stop} · target ${x.target}<br>${E(x.bucket_label||"")}: about ${x.suggested_qty} units (${R(x.size_inr||0)})<br>${x.backtest&&x.backtest.trades?`This rule won ${x.backtest.win_rate_pct}% of ${x.backtest.trades} past trades on this instrument.`:"Not enough history to test."}`)).join(""))||`<div class="empty">… No action. The bot speaks up only when a condition is met.</div>`;
 $("decM").innerHTML=$("dec").innerHTML=decs;
 $("arch").innerHTML=archived.length?archived.slice(0,12).map(x=>`<div class="row"><div class="sm">${E(x.decision_id)} · ◆ ${E(nice(x.symbol))}</div><div class="sm">${held.has(x.symbol)?"Bought":"Expired"} · ${ago(x.ts)}</div></div>`).join(""):`<div class="empty">Nothing archived yet.</div>`;
 const row=(l,v)=>`<div class="row"><div class="sm">${l}</div><div>${v}</div></div>`;
 const hl=row("State",`<b class="${state[2]}">${state[0]} ${state[1]}</b>`)+row("Last successful cycle",ago(s.heartbeat))+row("Checks every",s.interval_min+" min");
 $("healthM").innerHTML=hl;
 $("hl").innerHTML=`<div class="panel">${hl}${row("USD/INR used for sizing",s.usd_inr)}</div><h2>Engines</h2><div class="panel">`+hs.map(h=>{const k=h.status;const t={running:["◆ Active","up"],degraded:["◇ Degraded","gold"],error:["× Failure","pinkc"],not_connected:["— Not connected","sm"]}[k]||["◇ Starting","gold"];
  return `<div class="row"><div><div class="nm">${E(h.label)}</div><div class="sm">Last success ${ago(h.last_ok)}</div>${h.failed.length?`<div class="pinkc sm">${E(h.failed.join("; "))}</div>`:""}</div><div class="${t[1]}">${t[0]}</div></div>`}).join("")+`</div><h2>Data</h2><div class="panel">${row("Price data","Yahoo Finance, free and delayed")}${row("Alerts","Telegram")}${row("Ledger","Saved after every check")}</div>`;
 // portfolios tab
 $("pf").innerHTML=s.portfolio.map(b=>`<h2 style="color:${COL[b.id]}">${E(b.label)}</h2><div class="strip"><div class="k"><small>Capital</small><b>${R(b.capital)}</b></div><div class="k"><small>Cash</small><b>${R(b.cash)}</b></div><div class="k"><small>Deployed</small><b>${R(b.deployed)}</b></div><div class="k"><small>Profit / loss</small><b class="${cl(b.realised+b.unrealised)}">${S(b.realised+b.unrealised)}</b></div></div>`+(b.active?"":`<p class="sm">Not connected yet. Needs live intraday or options data.</p>`)).join("");
 // market
 const g={};s.latest.forEach(x=>(g[x.universe]=g[x.universe]||[]).push(x));
 $("mk").innerHTML=Object.keys(s.health).filter(k=>g[k]).map(k=>`<h2>${E(s.health[k].label)}</h2><div class="panel">`+g[k].map(x=>`<div class="row"><div><div class="nm">${E(nice(x.symbol))}</div><div class="sm">${x.trend_up?"Rising long-term":"Not rising long-term"} · ${E(x.asof)}</div><div class="bar" style="width:140px"><i style="width:${Math.min(100,x.rsi)}%;background:var(--lav)"></i></div></div><div class="r"><div class="nm">${x.symbol.startsWith("^")?"":k==="india_equity"?"₹":"$"}${Number(x.price).toLocaleString("en-IN")}</div><div class="sm">Momentum ${x.rsi}</div></div></div>`).join("")+`</div>`).join("")+`<p class="sm">Momentum: under 45 = dipped (possible buy zone), over 75 = run up.</p>`;
 $("pos").innerHTML=s.positions.length?s.positions.map(p=>{const px=(s.latest.find(x=>x.symbol===p.symbol)||{}).price,u=px?(px-p.price)*(p.qty||0)*p.fx:0;return `<div class="row"><div><div class="nm">${E(nice(p.symbol))} <span class="sm">${E(p.decision_id)}</span></div><div class="sm">${E((B[p.bucket]||{}).label||"")} · ${p.qty} units at ${p.price}</div><div class="sm">Stop ${p.stop??"-"} · Target ${p.target??"-"}</div></div><div class="r nm ${cl(u)}">${S(u)}</div></div>`}).join(""):`<div class="empty">… No open positions.</div>`;
 // ledger
 const cl_={};s.closed.forEach(c=>cl_[c.decision_id]=c);const op={};s.positions.forEach(p=>op[p.decision_id]=p);
 const lr=s.signals.slice().reverse().map(x=>{const c=cl_[x.decision_id],o=op[x.decision_id],live=c||o,exp=Date.now()-new Date(x.ts)>3*864e5;
  return [x.decision_id,nice(x.symbol),x.bucket_label||"",c?"LIVE · closed":o?"LIVE · open":exp?"MISSED":"Open signal",x.entry,c?c.exit_price:"",c?`<span class="${cl(c.pnl_inr)}">${S(c.pnl_inr)} (${c.actual_return_pct}%)</span>`:""]});
 $("led").innerHTML=lr.length?`<table><tr><th>ID</th><th>Instrument</th><th>Portfolio</th><th>Status</th><th>Signal at</th><th>Exit</th><th>Result</th></tr>${lr.map(r=>"<tr>"+r.map((v,i)=>`<td>${i==6?v:E(v)}</td>`).join("")+"</tr>").join("")}</table>`:`<div class="empty">No decisions yet.</div>`;
}
load();setInterval(load,60000);
</script></body></html>
